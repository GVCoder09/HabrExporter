[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "habr-exporter"
dynamic = ["version"]
description = "Save Habr articles (with comments) as PDF, HTML, DOCX, EPUB, FB2, Markdown and JSON: a PyQt6 application"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GVCoder09" }]
keywords = ["habr", "habr.com", "export", "pdf", "epub", "fb2", "docx", "markdown", "backup", "pyqt6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "requests>=2.31",
    "lxml>=5.0",
    "python-docx>=1.1",
    "Pygments>=2.17",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/GVCoder09/HabrExporter"
Documentation = "https://github.com/GVCoder09/HabrExporter/tree/main/docs"
Issues = "https://github.com/GVCoder09/HabrExporter/issues"
Changelog = "https://github.com/GVCoder09/HabrExporter/blob/main/CHANGELOG.md"

[project.scripts]
habr-exporter-cli = "habr_exporter.cli:main"

[project.gui-scripts]
habr-exporter = "habr_exporter.app:main"

[tool.setuptools.dynamic]
version = { attr = "habr_exporter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
habr_exporter = ["assets/*.css", "assets/*.png", "assets/*.ico"]

# --- Ruff ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "N",        # pep8-naming
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "BLE",      # blind except
    "D",        # pydocstyle (PEP 257)
    "PL",       # pylint (subset below)
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic in UI strings and test data is expected
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "D1",       # missing docstrings are allowed for self-explanatory code
    "PLC0415",  # lazy Qt imports are intentional
    "N802",     # Qt method names (closeEvent etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"src/habr_exporter/gui/theme.py" = ["E501"]  # QSS stylesheet: one rule per line reads better

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"

# --- Pytest -------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not network\""
markers = [
    "network: tests that hit the real habr.com (run with: pytest -m network)",
]
qt_api = "pyqt6"

[tool.coverage.run]
source = ["habr_exporter"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "\\.\\.\\.$",
]
